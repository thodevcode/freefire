<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Free Fire Mini</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#1a1a2e;font-family:Arial,sans-serif}
canvas{display:block}
#btn{position:fixed;bottom:30px;right:30px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,0.2);border:3px solid rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;user-select:none;touch-action:none;cursor:pointer}
#btn:active{background:rgba(255,255,255,0.4)}
#gun{position:fixed;top:20px;right:20px;color:#fff;font-size:16px;background:rgba(0,0,0,0.5);padding:8px 16px;border-radius:8px}
#hp{position:fixed;top:20px;left:20px;color:#fff;font-size:16px;background:rgba(0,0,0,0.5);padding:8px 16px;border-radius:8px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="btn">BẮN</div>
<div id="gun">UMP</div>
<div id="hp">NPC: 200</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W,H;
function resize(){W=c.width=innerWidth;H=c.height=innerHeight}
addEventListener('resize',resize);resize();
const player={x:0,y:0,angle:0};
const npc={x:0,y:0,hp:200,maxHp:200};
let bullets=[];
let gun='UMP';
let gunStats={
UMP:{dmg:50,rof:100,spread:0.05,range:800,speed:15},
M1887:{dmg:100,rof:600,spread:0.1,range:300,speed:20}
};
let lastShot=0;
let dragging=false;
let dragStart={x:0,y:0};
let aimOffset={x:0,y:0};
let fireBtn=document.getElementById('btn');
let gunLabel=document.getElementById('gun');
let hpLabel=document.getElementById('hp');

function init(){
player.x=W/2;player.y=H/2;
npc.x=W/2+200;npc.y=H/2-100;
}
init();

function shoot(){
let now=Date.now();
if(now-lastShot<gunStats[gun].rof)return;
lastShot=now;
let s=gunStats[gun];
let angle=Math.atan2(npc.y-player.y,npc.x-player.x);
angle+=aimOffset.x*0.01;
let dx=Math.cos(angle),dy=Math.sin(angle);
bullets.push({x:player.x,y:player.y,dx,dy,dmg:s.dmg,speed:s.speed,life:s.range/s.speed});
}

function update(){
bullets.forEach(b=>{
b.x+=b.dx*b.speed;
b.y+=b.dy*b.speed;
b.life--;
if(Math.hypot(b.x-npc.x,b.y-npc.y)<30){
npc.hp-=b.dmg;
b.life=0;
}
});
bullets=bullets.filter(b=>b.life>0);
if(npc.hp<0)npc.hp=0;
hpLabel.textContent='NPC: '+npc.hp;
}

function draw(){
x.fillStyle='#2d4a3e';x.fillRect(0,0,W,H);
x.strokeStyle='#3a5a4a';x.lineWidth=1;
for(let i=0;i<W;i+=50){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}
for(let i=0;i<H;i+=50){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}
x.fillStyle='#4a8c5c';x.beginPath();x.arc(npc.x,npc.y,25,0,Math.PI*2);x.fill();
x.fillStyle='#8c4a4a';x.beginPath();x.arc(player.x,player.y,20,0,Math.PI*2);x.fill();
x.fillStyle='#fff';x.font='12px Arial';
x.fillText('NPC',npc.x-15,npc.y-35);
x.fillText('BẠN',player.x-15,player.y-30);
x.fillStyle='#ff0';
bullets.forEach(b=>{x.beginPath();x.arc(b.x,b.y,3,0,Math.PI*2);x.fill()});
let cx=W/2+aimOffset.x,cy=H/2+aimOffset.y;
x.strokeStyle='#0f0';x.lineWidth=2;
x.beginPath();x.moveTo(cx-15,cy);x.lineTo(cx+15,cy);x.moveTo(cx,cy-15);x.lineTo(cx,cy+15);x.stroke();
x.strokeStyle='#fff';x.lineWidth=1;
x.beginPath();x.arc(cx,cy,8,0,Math.PI*2);x.stroke();
}

function loop(){update();draw();requestAnimationFrame(loop)}
loop();

addEventListener('pointerdown',e=>{
if(e.target.id==='btn'){
dragging=true;
dragStart={x:e.clientX,y:e.clientY};
shoot();
}
});

addEventListener('pointermove',e=>{
if(dragging){
let dx=e.clientX-dragStart.x;
let dy=e.clientY-dragStart.y;
aimOffset.x=dx*0.5;
aimOffset.y=dy*0.5;
let max=100;
let d=Math.hypot(aimOffset.x,aimOffset.y);
if(d>max){aimOffset.x*=max/d;aimOffset.y*=max/d}
}
});

addEventListener('pointerup',e=>{
if(e.target.id==='btn'){dragging=false;aimOffset={x:0,y:0}}
});

setInterval(()=>{
if(dragging)shoot();
},50);

addEventListener('keydown',e=>{
if(e.key==='1'){gun='UMP';gunLabel.textContent='UMP'}
if(e.key==='2'){gun='M1887';gunLabel.textContent='M1887'}
});
</script>
</body>
</html>
