<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><title>FF Web Test</title><style>body{margin:0;overflow:hidden;background:#87CEEB;font-family:sans-serif;user-select:none}#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-weight:bold;font-size:30px;text-shadow:0 0 2px #000}#info{position:absolute;top:10px;left:10px;color:#fff;background:rgba(0,0,0,0.5);padding:10px;border-radius:5px}#damage{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:35px;font-weight:900;opacity:0;transition:opacity 0.1s}.headshot{color:red;text-shadow:1px 1px 0 #000}.bodyshot{color:white;text-shadow:1px 1px 0 #000}</style></head><body><div id="ui"><div id="crosshair">+</div><div id="info">Mục tiêu: <span id="hp">200</span> HP<br>Vũ khí: <span id="gun">UMP</span><br>Click vào màn hình để khóa chuột & bắn<br>Phím 1: UMP | Phím 2: M1887</div><div id="damage"></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>let scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);let renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);document.body.appendChild(renderer.domElement);let light=new THREE.DirectionalLight(0xffffff,1);light.position.set(5,10,5);scene.add(light);scene.add(new THREE.AmbientLight(0x404040));let ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshLambertMaterial({color:0x3b5e2b}));ground.rotation.x=-Math.PI/2;scene.add(ground);let npc=new THREE.Mesh(new THREE.BoxGeometry(1,2,1),new THREE.MeshLambertMaterial({color:0xff3333}));npc.position.set(0,1,-8);scene.add(npc);let hp=200,sens=0.002,pitch=0,yaw=0,isFiring=false,lastFire=0;let guns={ump:{dmg:15,rate:90,recoil:0.015,name:'UMP'},m1887:{dmg:25,pellets:4,rate:850,recoil:0.08,name:'M1887'}};let curGun=guns.ump;camera.position.set(0,1.6,0);let rc=new THREE.Raycaster();let dmgUi=document.getElementById('damage'),hpUi=document.getElementById('hp');document.addEventListener('mousemove',e=>{if(document.pointerLockElement){yaw-=e.movementX*sens;pitch-=e.movementY*sens;pitch=Math.max(-Math.PI/2,Math.min(Math.PI/2,pitch));camera.quaternion.setFromEuler(new THREE.Euler(pitch,yaw,0,'YXZ'));}});document.addEventListener('mousedown',()=>{document.body.requestPointerLock();isFiring=true;});document.addEventListener('mouseup',()=>isFiring=false);document.addEventListener('keydown',e=>{if(e.key==='1'){curGun=guns.ump;document.getElementById('gun').innerText=curGun.name;}if(e.key==='2'){curGun=guns.m1887;document.getElementById('gun').innerText=curGun.name;}});function showDmg(d,isHead){dmgUi.innerText='-'+d;dmgUi.className=isHead?'headshot':'bodyshot';dmgUi.style.opacity=1;dmgUi.style.top=(40+Math.random()*5)+'%';dmgUi.style.left=(50+Math.random()*2-1)+'%';setTimeout(()=>dmgUi.style.opacity=0,300);}function fire(){let now=Date.now();if(now-lastFire>=curGun.rate){lastFire=now;pitch+=curGun.recoil;rc.setFromCamera(new THREE.Vector2(0,0),camera);let hits=rc.intersectObject(npc);if(hits.length>0){let isHead=hits[0].point.y>1.6;let mult=isHead?3:1;let totalDmg=(curGun.pellets?curGun.dmg*curGun.pellets:curGun.dmg)*mult;hp-=totalDmg;if(hp<=0){hp=200;npc.position.x=(Math.random()-0.5)*10;}hpUi.innerText=hp;showDmg(totalDmg,isHead);npc.material.color.setHex(0xffffff);setTimeout(()=>npc.material.color.setHex(0xff3333),50);}}}function anim(){requestAnimationFrame(anim);if(isFiring)fire();renderer.render(scene,camera);}anim();window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});</script></body></html>
