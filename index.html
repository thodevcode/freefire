<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gojo Arena</title><style>*{margin:0;padding:0;box-sizing:border-box}body{overflow:hidden;font-family:sans-serif;background:#000;user-select:none}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 0 6px #000;font-family:sans-serif}#hpBar{position:absolute;left:20px;bottom:20px;width:320px;height:34px;background:rgba(0,0,0,.55);border:2px solid #fff;border-radius:8px;overflow:hidden}#hpFill{height:100%;background:linear-gradient(90deg,#00ff88,#88ff00);width:100%;transition:width .15s}#hpBar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px}#skills{position:absolute;right:20px;bottom:20px;display:flex;gap:10px}.sk{width:78px;height:78px;background:rgba(0,0,0,.6);border:2px solid #fff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;position:relative;overflow:hidden;line-height:1.2}.sk b{font-size:18px}.sk .cd{position:absolute;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold}#settings{position:absolute;top:12px;right:12px;pointer-events:auto;background:rgba(0,0,0,.65);padding:12px;border-radius:10px;font-size:13px;border:1px solid #444}#settings label{display:block;margin:6px 0;cursor:pointer}#settings input[type=range]{width:140px;vertical-align:middle}#pov{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.65);padding:8px 14px;border-radius:10px;font-size:13px;border:1px solid #444}#vMenu{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,0,20,.95);padding:28px 32px;border-radius:16px;color:#fff;text-align:center;z-index:100;border:2px solid #a020f0;box-shadow:0 0 40px #a020f0}#vMenu h3{margin-bottom:14px;font-size:20px;letter-spacing:2px;color:#c060ff}#vMenu button{display:block;width:230px;margin:10px 0;padding:14px;background:linear-gradient(90deg,#5a00a0,#a020f0);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:15px;font-weight:bold;transition:transform .1s}#vMenu button:hover{transform:scale(1.05)}#dmgFlash{position:fixed;inset:0;background:red;opacity:0;pointer-events:none;transition:opacity .3s;z-index:50}#cinema{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;pointer-events:none;z-index:10}#crosshair:before,#crosshair:after{content:'';position:absolute;background:#fff;box-shadow:0 0 3px #000}#crosshair:before{left:9px;top:0;width:2px;height:20px}#crosshair:after{top:9px;left:0;width:20px;height:2px}#hint{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);color:#aaa;font-size:12px;pointer-events:none;z-index:20}</style></head><body><div id="hud"><div id="hpBar"><div id="hpFill"></div><span id="hpText">500 / 500</span></div><div id="skills"><div class="sk" id="skZ"><b>Z</b>Hách<div class="cd" id="cdZ"></div></div><div class="sk" id="skX"><b>X</b>Thương<div class="cd" id="cdX"></div></div><div class="sk" id="skC"><b>C</b>Lãnh địa<div class="cd" id="cdC"></div></div><div class="sk" id="skV"><b>V</b>Hư thức tử<div class="cd" id="cdV"></div></div></div><div id="settings"><label>☀ Độ sáng <input type="range" id="bright" min="0.3" max="2" step="0.05" value="1"></label><label><input type="checkbox" id="noCD"> Không hồi chiêu</label></div><div id="pov">POV: <b id="povLabel">Góc nhìn 3</b> (1/2/3)</div></div><div id="crosshair"></div><div id="dmgFlash"></div><div id="cinema"></div><div id="vMenu" style="display:none"><h3>HƯ THỨC TỬ</h3><button data-mode="normal">Bình thường</button><button data-mode="destroy">Hủy diệt</button></div><div id="hint">WASD di chuyển • Click chuột trái đánh • 1/2/3 đổi POV • Z X C V dùng chiêu</div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>const R=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1;document.body.appendChild(R.domElement);const S=new THREE.Scene();S.background=new THREE.Color(0x87ceeb);S.fog=new THREE.Fog(0x87ceeb,80,240);const C=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,500);const H=new THREE.HemisphereLight(0xffffff,0x445544,.9);S.add(H);const Sun=new THREE.DirectionalLight(0xffffff,1.1);Sun.position.set(60,90,40);Sun.castShadow=true;Sun.shadow.mapSize.set(2048,2048);Object.assign(Sun.shadow.camera,{left:-120,right:120,top:120,bottom:-120,near:1,far:250});Sun.shadow.bias=-.0004;S.add(Sun);const GMat=new THREE.MeshStandardMaterial({color:0x3d7a3d,roughness:.95});const G=new THREE.Mesh(new THREE.PlaneGeometry(220,220),GMat);G.rotation.x=-Math.PI/2;G.receiveShadow=true;S.add(G);const path=new THREE.Mesh(new THREE.PlaneGeometry(20,220),new THREE.MeshStandardMaterial({color:0x8a7a5a,roughness:.95}));path.rotation.x=-Math.PI/2;path.position.y=.01;path.receiveShadow=true;S.add(path);const path2=new THREE.Mesh(new THREE.PlaneGeometry(220,20),new THREE.MeshStandardMaterial({color:0x8a7a5a,roughness:.95}));path2.rotation.x=-Math.PI/2;path2.position.y=.01;path2.receiveShadow=true;S.add(path2);function mkGojo(){const g=new THREE.Group();const dark=new THREE.MeshStandardMaterial({color:0x14142a,roughness:.55});const skin=new THREE.MeshStandardMaterial({color:0xf5d0b0,roughness:.6});const hairMat=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x8888aa,emissiveIntensity:.25,roughness:.4,metalness:.1});const legL=new THREE.Mesh(new THREE.CapsuleGeometry(.16,.55,4,8),dark);legL.position.set(-.18,.5,0);legL.castShadow=true;const legR=legL.clone();legR.position.x=.18;const body=new THREE.Mesh(new THREE.CapsuleGeometry(.36,.7,6,14),dark);body.position.y=1.15;body.castShadow=true;const armL=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.55,4,8),dark);armL.position.set(-.44,1.15,0);armL.rotation.z=.12;armL.castShadow=true;const armR=armL.clone();armR.position.x=.44;armR.rotation.z=-.12;const head=new THREE.Mesh(new THREE.SphereGeometry(.27,20,20),skin);head.position.y=1.85;head.castShadow=true;const hair=new THREE.Mesh(new THREE.SphereGeometry(.31,20,20,0,Math.PI*2,0,Math.PI*.68),hairMat);hair.position.y=1.9;for(let i=0;i<11;i++){const sp=new THREE.Mesh(new THREE.ConeGeometry(.06,.32,6),hairMat);const a=i/11*Math.PI*2;sp.position.set(Math.cos(a)*.23,2.1,Math.sin(a)*.23);sp.rotation.set(Math.cos(a)*.45,0,-Math.sin(a)*.45);g.add(sp);}const bf=new THREE.Mesh(new THREE.CylinderGeometry(.285,.285,.14,24,1,true),new THREE.MeshStandardMaterial({color:0x050508,side:THREE.DoubleSide,roughness:.3}));bf.position.y=1.87;const collar=new THREE.Mesh(new THREE.TorusGeometry(.32,.04,6,20),new THREE.MeshStandardMaterial({color:0x2a2a5a}));collar.rotation.x=Math.PI/2;collar.position.y=1.55;g.add(legL,legR,body,armL,armR,head,hair,bf,collar);return g;}function mkNpc(x,z){const g=new THREE.Group();const mat=new THREE.MeshStandardMaterial({color:0x7a1515,roughness:.75});const b=new THREE.Mesh(new THREE.CapsuleGeometry(.3,.7,4,10),mat);b.position.y=1.05;b.castShadow=true;const h=new THREE.Mesh(new THREE.SphereGeometry(.24,14,14),new THREE.MeshStandardMaterial({color:0xd0a080}));h.position.y=1.75;h.castShadow=true;const a1=new THREE.Mesh(new THREE.CapsuleGeometry(.1,.5,4,6),mat);a1.position.set(-.4,1.05,0);a1.castShadow=true;const a2=a1.clone();a2.position.x=.4;const leg1=new THREE.Mesh(new THREE.CapsuleGeometry(.1,.5,4,6),mat);leg1.position.set(-.15,.4,0);leg1.castShadow=true;const leg2=leg1.clone();leg2.position.x=.15;g.add(b,h,a1,a2,leg1,leg2);g.position.set(x,0,z);return g;}function mkHpBar(){const c=document.createElement('canvas');c.width=128;c.height=18;const ctx=c.getContext('2d');const tex=new THREE.CanvasTexture(c);const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,depthWrite:false}));spr.scale.set(2.2,.28,1);spr.userData={ctx,tex};return spr;}function updateHpBar(spr,hp,mx){const{ctx,tex}=spr.userData;ctx.clearRect(0,0,128,18);ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,128,18);ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.strokeRect(1,1,126,16);ctx.fillStyle=hp>mx*.5?'#00e040':hp>mx*.2?'#ffbb00':'#ff2020';ctx.fillRect(2,2,124*Math.max(0,hp/mx),14);tex.needsUpdate=true;}function mkTree(x,z){const g=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.28,.4,3,8),new THREE.MeshStandardMaterial({color:0x5a3a1a,roughness:.9}));trunk.position.y=1.5;trunk.castShadow=true;trunk.receiveShadow=true;g.add(trunk);for(let i=0;i<3;i++){const leaf=new THREE.Mesh(new THREE.ConeGeometry(1.6-i*.35,2,8),new THREE.MeshStandardMaterial({color:0x2d6a2d,roughness:.8,flatShading:true}));leaf.position.y=3.2+i*1.1;leaf.castShadow=true;g.add(leaf);}g.position.set(x,0,z);return g;}function mkRock(x,z){const sc=.8+Math.random()*1.2;const r=new THREE.Mesh(new THREE.DodecahedronGeometry(sc,0),new THREE.MeshStandardMaterial({color:0x6a6a6a,roughness:.95,flatShading:true}));r.position.set(x,sc*.5,z);r.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);r.castShadow=true;r.receiveShadow=true;return r;}function mkHouse(x,z){const g=new THREE.Group();const w=5;const body=new THREE.Mesh(new THREE.BoxGeometry(w,3.5,w),new THREE.MeshStandardMaterial({color:0xc4a484,roughness:.85}));body.position.y=1.75;body.castShadow=true;body.receiveShadow=true;const roof=new THREE.Mesh(new THREE.ConeGeometry(w*.85,2.2,4),new THREE.MeshStandardMaterial({color:0x8b2a2a,roughness:.85}));roof.position.y=4.6;roof.rotation.y=Math.PI/4;roof.castShadow=true;const door=new THREE.Mesh(new THREE.BoxGeometry(1.2,2,.15),new THREE.MeshStandardMaterial({color:0x3a2010}));door.position.set(0,1,w/2+.01);g.add(body,roof,door);g.position.set(x,0,z);return g;}const playerMesh=mkGojo();S.add(playerMesh);const player={hp:500,maxHp:500,pos:new THREE.Vector3(0,0,0),rot:0,mesh:playerMesh,alive:true,atkCd:0};const npcs=[];const structures=[];for(let i=0;i<12;i++){const a=i/12*Math.PI*2+.3;const r=22+Math.random()*25;const x=Math.cos(a)*r;const z=Math.sin(a)*r;const m=mkNpc(x,z);S.add(m);const bar=mkHpBar();bar.position.set(0,2.4,0);m.add(bar);npcs.push({hp:500,maxHp:500,mesh:m,pos:new THREE.Vector3(x,0,z),alive:true,bar,atkCd:0});}for(let i=0;i<35;i++){let x,z,ok;let tries=0;do{x=(Math.random()-.5)*170;z=(Math.random()-.5)*170;ok=Math.hypot(x,z)>8&&Math.abs(x)>4&&Math.abs(z)>4;tries++;}while(!ok&&tries<10);if(Math.hypot(x,z)<8)continue;const r=Math.random();if(r<.65){const t=mkTree(x,z);S.add(t);structures.push({mesh:t,hp:200,maxHp:200,alive:true,type:'tree',respawnAt:0,x,z});}else if(r<.9){const rk=mkRock(x,z);S.add(rk);structures.push({mesh:rk,hp:300,maxHp:300,alive:true,type:'rock',respawnAt:0,x,z});}}for(let i=0;i<4;i++){const a=i/4*Math.PI*2+Math.PI/4;const x=Math.cos(a)*45;const z=Math.sin(a)*45;const h=mkHouse(x,z);S.add(h);structures.push({mesh:h,hp:800,maxHp:800,alive:true,type:'house',respawnAt:0,x,z});}const keys={};const state={camYaw:0,camPitch:.35,camMode:0,cd:{Z:0,X:0,C:0,V:0},noCD:false,domain:0,brightness:1,chargingZ:false,chargeZ:0,chargingV:false,chargeV:0,thung:null,thungTimer:0,thungHeld:false,vMenuOpen:false,vTarget:null,locked:false,cinemaMode:null,cinemaTimer:0,redSphere:null,redCharge:0,domainMesh:null,domainWalls:null};function getDir(){return new THREE.Vector3(-Math.sin(state.camYaw)*Math.cos(state.camPitch),-Math.sin(state.camPitch),-Math.cos(state.camYaw)*Math.cos(state.camPitch)).normalize();}function getFwd(){return new THREE.Vector3(-Math.sin(state.camYaw),0,-Math.cos(state.camYaw));}function getRight(){return new THREE.Vector3(Math.cos(state.camYaw),0,-Math.sin(state.camYaw));}let AC=null;function sfx(type){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime;if(type==='red'){const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(380,t);o.frequency.exponentialRampToValueAtTime(70,t+.5);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.5);}else if(type==='charge'){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.linearRampToValueAtTime(500,t+.3);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.3);}else if(type==='blue'){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(180,t);o.frequency.linearRampToValueAtTime(700,t+.6);g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.6);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.6);}else if(type==='domain'){const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.setValueAtTime(50,t);o.frequency.exponentialRampToValueAtTime(900,t+1.2);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+1.5);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+1.5);}else if(type==='purple'){const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(1400,t+.7);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.9);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.9);}else if(type==='explosion'){const buf=AC.createBuffer(1,AC.sampleRate*1,AC.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);const src=AC.createBufferSource();src.buffer=buf;const g=AC.createGain();g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+1);const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(1500,t);src.connect(f);f.connect(g);g.connect(AC.destination);src.start(t);}else if(type==='punch'){const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.setValueAtTime(320,t);o.frequency.exponentialRampToValueAtTime(80,t+.1);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.12);}else if(type==='hit'){const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(90,t+.15);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.15);}}catch(e){}}function damageNpc(n,dmg){if(!n.alive)return;if(state.domain>0||state.chargingZ){dmg=Math.max(dmg,dmg*1.5);}n.hp-=dmg;updateHpBar(n.bar,n.hp,n.maxHp);if(n.hp<=0){n.alive=false;n.mesh.visible=false;n.bar.visible=false;setTimeout(()=>{n.hp=500;n.alive=true;n.mesh.visible=true;n.bar.visible=true;n.pos.set(n.pos.x,0,n.pos.z);updateHpBar(n.bar,n.hp,n.maxHp);},7000);}}function damageStructure(s,dmg){if(!s.alive)return;s.hp-=dmg;if(s.hp<=0){s.alive=false;s.mesh.visible=false;s.respawnAt=performance.now()+6000;}}function damagePlayer(dmg){if(!player.alive)return;player.hp-=dmg;const f=document.getElementById('dmgFlash');f.style.opacity='.35';setTimeout(()=>f.style.opacity='0',120);sfx('hit');if(player.hp<=0){player.hp=0;player.alive=false;setTimeout(()=>{player.hp=500;player.alive=true;player.pos.set(0,0,0);},3000);}}function getNearestNpc(){const arr=npcs.filter(n=>n.alive);if(!arr.length)return null;return arr.sort((a,b)=>a.pos.distanceTo(player.pos)-b.pos.distanceTo(player.pos))[0];}function attackMelee(){if(!player.alive)return;if(player.atkCd>0)return;player.atkCd=.4;sfx('punch');const dir=getDir();const origin=new THREE.Vector3(player.pos.x,player.pos.y+1.5,player.pos.z);for(const n of npcs){if(!n.alive)continue;const to=n.pos.clone().sub(origin);const dist=to.length();if(dist<3.5){to.normalize();if(to.dot(dir)>.3){damageNpc(n,35);sfx('hit');}}for(const s of structures){if(!s.alive)continue;const toS=new THREE.Vector3(s.x,0,s.z).sub(origin);const dS=toS.length();if(dS<4){toS.normalize();if(toS.dot(new THREE.Vector3(dir.x,0,dir.z).normalize())>.5){damageStructure(s,40);}}}}}function fireRed(){const power=Math.min(1,state.chargeZ/2);state.cd.Z=state.noCD?0:5;sfx('red');const dir=getDir();const origin=new THREE.Vector3(player.pos.x,player.pos.y+1.5,player.pos.z).addScaledVector(dir,1);const size=.6+power*1.4;const sphere=new THREE.Mesh(new THREE.SphereGeometry(size,24,24),new THREE.MeshBasicMaterial({color:0xff2020,transparent:true,opacity:.9}));sphere.position.copy(origin);S.add(sphere);const glow=new THREE.PointLight(0xff3030,2,20);sphere.add(glow);const ring=new THREE.Mesh(new THREE.TorusGeometry(size*1.4,.08,8,32),new THREE.MeshBasicMaterial({color:0xff6060}));sphere.add(ring);let life=0;const speed=45;const damage=60+power*180;const proj={mesh:sphere,dir:dir.clone(),life:0,damage,size};projectiles.push(proj);}const projectiles=[];function startThung(){if(!player.alive)return;if(state.thung)return;state.cd.X=state.noCD?0:10;sfx('blue');const mesh=new THREE.Mesh(new THREE.SphereGeometry(1.3,24,24),new THREE.MeshBasicMaterial({color:0x3080ff,transparent:true,opacity:.85}));mesh.position.copy(player.pos).add(new THREE.Vector3(0,2,0));S.add(mesh);const glow=new THREE.PointLight(0x3080ff,2.5,15);mesh.add(glow);state.thung={mesh};state.thungTimer=8;}function startDomain(){if(!player.alive)return;state.cd.C=state.noCD?0:20;state.domain=20;sfx('domain');const dm=new THREE.Mesh(new THREE.SphereGeometry(35,32,32),new THREE.MeshBasicMaterial({color:0x1a0030,transparent:true,opacity:.35,side:THREE.BackSide}));dm.position.copy(player.pos).add(new THREE.Vector3(0,10,0));S.add(dm);state.domainMesh=dm;const inner=new THREE.Mesh(new THREE.SphereGeometry(33,32,32),new THREE.MeshBasicMaterial({color:0x400080,transparent:true,opacity:.15,side:THREE.BackSide}));inner.position.copy(dm.position);S.add(inner);state.domainWalls=inner;S.background=new THREE.Color(0x0a0015);S.fog.color.setHex(0x0a0015);}function endDomain(){state.domain=0;if(state.domainMesh){S.remove(state.domainMesh);state.domainMesh=null;}if(state.domainWalls){S.remove(state.domainWalls);state.domainWalls=null;}S.background=new THREE.Color(0x87ceeb);S.fog.color.setHex(0x87ceeb);}function openVMenu(){state.vMenuOpen=true;state.vTarget=getNearestNpc();document.getElementById('vMenu').style.display='block';document.exitPointerLock();}function executeV(mode){document.getElementById('vMenu').style.display='none';state.vMenuOpen=false;state.cd.V=state.noCD?0:25;const tgt=state.vTarget&&state.vTarget.alive?state.vTarget:getNearestNpc();if(mode==='normal'){sfx('purple');const from=new THREE.Vector3(player.pos.x,player.pos.y+1.5,player.pos.z);const to=tgt?new THREE.Vector3(tgt.pos.x,1,tgt.pos.z):from.clone().addScaledVector(getDir(),50);const beam=new THREE.Mesh(new THREE.CylinderGeometry(.7,.7,from.distanceTo(to),16),new THREE.MeshBasicMaterial({color:0xa020f0,transparent:true,opacity:.85}));beam.position.copy(from.clone().lerp(to,.5));beam.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),to.clone().sub(from).normalize());S.add(beam);const orb=new THREE.Mesh(new THREE.SphereGeometry(1,20,20),new THREE.MeshBasicMaterial({color:0xc060ff}));orb.position.copy(from);S.add(orb);let t=0;const anim=()=>{t+=.03;if(t<1){orb.position.copy(from).lerp(to,t);requestAnimationFrame(anim);}else{if(tgt)damageNpc(tgt,500);S.remove(orb);setTimeout(()=>{S.remove(beam);},200);}};anim();state.cinemaMode='v-normal';state.cinemaTimer=2;}else{sfx('explosion');const sphere=new THREE.Mesh(new THREE.SphereGeometry(1,32,32),new THREE.MeshBasicMaterial({color:0xc060ff,transparent:true,opacity:.95}));sphere.position.copy(player.pos).add(new THREE.Vector3(0,3,0));S.add(sphere);let r=1;const anim=()=>{r+=2.5;sphere.scale.setScalar(r);sphere.material.opacity=Math.max(0,1-r/40);if(r<40){requestAnimationFrame(anim);}else{S.remove(sphere);}};anim();setTimeout(()=>{for(const n of npcs){if(!n.alive)continue;if(n.pos.distanceTo(player.pos)<35)damageNpc(n,500);}for(const s of structures){if(!s.alive)continue;if(new THREE.Vector3(s.x,0,s.z).distanceTo(player.pos)<35)damageStructure(s,9999);}},300);state.cinemaMode='v-destroy';state.cinemaTimer=2;}}document.addEventListener('pointerlockchange',()=>{state.locked=document.pointerLockElement===R.domElement;});document.body.addEventListener('click',e=>{if(e.target.closest('#vMenu')||e.target.closest('#settings'))return;if(!state.locked&&!state.vMenuOpen){R.domElement.requestPointerLock();}});document.addEventListener('mousemove',e=>{if(state.locked){state.camYaw-=e.movementX*.0025;state.camPitch-=e.movementY*.0025;state.camPitch=Math.max(-.4,Math.min(1.1,state.camPitch));}});document.addEventListener('mousedown',e=>{if(state.locked&&e.button===0&&!state.vMenuOpen){attackMelee();}});document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k==='1'){state.camMode=0;document.getElementById('povLabel').textContent='Góc nhìn 3';}if(k==='2'){state.camMode=1;document.getElementById('povLabel').textContent='Góc nhìn 1';}if(k==='3'){state.camMode=2;document.getElementById('povLabel').textContent='Góc nhìn 2';}if(k==='z'&&!state.chargingZ&&(state.cd.Z<=0||state.noCD)&&!state.vMenuOpen){state.chargingZ=true;state.chargeZ=0;sfx('charge');}if(k==='x'&&(state.cd.X<=0||state.noCD)&&!state.thung&&!state.vMenuOpen){startThung();state.thungHeld=true;}if(k==='c'&&(state.cd.C<=0||state.noCD)&&state.domain<=0&&!state.vMenuOpen){startDomain();}if(k==='v'&&!state.chargingV&&(state.cd.V<=0||state.noCD)&&!state.vMenuOpen){state.chargingV=true;state.chargeV=0;sfx('charge');}});document.addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys[k]=false;if(k==='z'&&state.chargingZ){if(state.chargeZ>.2){fireRed();}state.chargingZ=false;state.chargeZ=0;}if(k==='x'&&state.thung&&state.thungHeld){S.remove(state.thung.mesh);state.thung=null;state.thungHeld=false;}if(k==='v'&&state.chargingV){state.chargingV=false;if(state.chargeV>.2){openVMenu();}}});document.getElementById('vMenu').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;executeV(b.dataset.mode);});document.getElementById('bright').addEventListener('input',e=>{state.brightness=+e.target.value;R.toneMappingExposure=state.brightness;});document.getElementById('noCD').addEventListener('change',e=>{state.noCD=e.target.checked;});addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});const clock=new THREE.Clock();function updateCamera(dt){const p=player.pos;const dir=getDir();if(state.camMode===1){C.position.set(p.x,p.y+1.85,p.z);C.lookAt(C.position.clone().add(dir));}else if(state.camMode===2){const d=5;C.position.set(p.x+dir.x*d,p.y+2,p.z+dir.z*d);C.lookAt(p.x,p.y+1.6,p.z);}else{const d=7;C.position.set(p.x-dir.x*d,p.y+3.5-dir.y*d,p.z-dir.z*d);C.lookAt(p.x,p.y+1.6,p.z);}if(state.cinemaMode==='v-normal'){const tgt=state.vTarget;if(tgt&&tgt.alive){const mid=player.pos.clone().lerp(tgt.pos,.5).add(new THREE.Vector3(0,4,0));C.position.set(player.pos.x-5,player.pos.y+4,player.pos.z);C.lookAt(tgt.pos.x,1,tgt.pos.z);}state.cinemaTimer-=dt;if(state.cinemaTimer<=0)state.cinemaMode=null;}else if(state.cinemaMode==='v-destroy'){C.position.set(player.pos.x-8,player.pos.y+8,player.pos.z-8);C.lookAt(player.pos.x,player.pos.y+3,player.pos.z);state.cinemaTimer-=dt;if(state.cinemaTimer<=0)state.cinemaMode=null;}}function updatePlayer(dt){if(!player.alive)return;const speed=9;const fwd=getFwd();const right=getRight();let mv=new THREE.Vector3();if(keys['w'])mv.add(fwd);if(keys['s'])mv.sub(fwd);if(keys['a'])mv.sub(right);if(keys['d'])mv.add(right);if(mv.length()>0){mv.normalize();player.pos.addScaledVector(mv,speed*dt);if(state.camMode!==1){player.rot=Math.atan2(mv.x,mv.z);player.mesh.rotation.y=player.rot;}}player.pos.x=Math.max(-100,Math.min(100,player.pos.x));player.pos.z=Math.max(-100,Math.min(100,player.pos.z));player.mesh.position.copy(player.pos);if(state.camMode===1){player.mesh.rotation.y=state.camYaw;}player.atkCd=Math.max(0,player.atkCd-dt);}function updateNpcs(dt){for(const n of npcs){if(!n.alive)continue;if(state.domain>0)continue;const d=n.pos.distanceTo(player.pos);if(d<28&&d>2.2){const dir=player.pos.clone().sub(n.pos).setY(0).normalize();n.pos.addScaledVector(dir,3.2*dt);n.pos.x=Math.max(-100,Math.min(100,n.pos.x));n.pos.z=Math.max(-100,Math.min(100,n.pos.z));n.mesh.position.copy(n.pos);n.mesh.rotation.y=Math.atan2(dir.x,dir.z);}else if(d<=2.2){n.atkCd-=dt;if(n.atkCd<=0){n.atkCd=1.3;damagePlayer(12);}}updateHpBar(n.bar,n.hp,n.maxHp);}}function updateProjectiles(dt){for(let i=projectiles.length-1;i>=0;i--){const p=projectiles[i];p.life+=dt;p.mesh.position.addScaledVector(p.dir,45*dt);let hit=false;for(const n of npcs){if(!n.alive)continue;if(n.pos.distanceTo(p.mesh.position)<2.5){damageNpc(n,p.damage);hit=true;}}for(const s of structures){if(!s.alive)continue;if(new THREE.Vector3(s.x,0,s.z).distanceTo(p.mesh.position)<3){damageStructure(s,p.damage);hit=true;}}if(hit||p.life>1.5){S.remove(p.mesh);projectiles.splice(i,1);}}}function updateThung(dt){if(!state.thung)return;state.thungTimer-=dt;const dir=getDir();const target=player.pos.clone().add(new THREE.Vector3(0,1.5,0)).addScaledVector(dir,9);state.thung.mesh.position.lerp(target,Math.min(1,dt*4));state.thung.mesh.rotation.y+=dt*3;for(const n of npcs){if(!n.alive)continue;if(n.pos.distanceTo(state.thung.mesh.position)<2.5){damageNpc(n,dt*120);}}for(const s of structures){if(!s.alive)continue;if(new THREE.Vector3(s.x,0,s.z).distanceTo(state.thung.mesh.position)<3.5){damageStructure(s,dt*100);}}if(state.thungTimer<=0){S.remove(state.thung.mesh);state.thung=null;state.thungHeld=false;}}function updateStructures(){const now=performance.now();for(const s of structures){if(!s.alive&&s.respawnAt&&now>=s.respawnAt){s.alive=true;s.hp=s.maxHp;s.mesh.visible=true;s.respawnAt=0;}}}function updateCharging(dt){if(state.chargingZ){state.chargeZ=Math.min(state.chargeZ+dt,2);if(!state.redSphere){const mesh=new THREE.Mesh(new THREE.SphereGeometry(.5,20,20),new THREE.MeshBasicMaterial({color:0xff2020,transparent:true,opacity:.85}));S.add(mesh);state.redSphere=mesh;}const dir=getDir();state.redSphere.position.copy(player.pos).add(new THREE.Vector3(0,1.5,0)).addScaledVector(dir,1.5);const s=.3+state.chargeZ*.7;state.redSphere.scale.setScalar(s);state.redSphere.rotation.y+=dt*8;state.redSphere.rotation.x+=dt*5;}else if(state.redSphere){S.remove(state.redSphere);state.redSphere=null;}if(state.chargingV){state.chargeV=Math.min(state.chargeV+dt,2);}}function updateDomain(dt){if(state.domain>0){state.domain-=dt;if(state.domain<=0)endDomain();}}function updateHUD(){document.getElementById('hpFill').style.width=(player.hp/player.maxHp*100)+'%';document.getElementById('hpText').textContent=Math.ceil(player.hp)+' / '+player.maxHp;['Z','X','C','V'].forEach(k=>{const el=document.getElementById('cd'+k);const cd=state.cd[k];if(cd>0&&!state.noCD){el.style.display='flex';el.textContent=Math.ceil(cd);}else{el.style.display='none';}});}function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);updatePlayer(dt);updateNpcs(dt);updateProjectiles(dt);updateThung(dt);updateStructures();updateCharging(dt);updateDomain(dt);for(const k in state.cd){if(state.cd[k]>0&&!state.noCD)state.cd[k]=Math.max(0,state.cd[k]-dt);}updateCamera(dt);updateHUD();R.render(S,C);}animate();</script></body></html>
